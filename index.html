function sentenceQ(s){let tokens=s.en.match(/[A-Za-z]+(?:['’][A-Za-z]+)?|[0-9]+|[.,!?]/g);return{kind:'sentence',key:s.id,prompt:s.ru,answer:s.en,label:'Собери предложение по-английски',rule:s.rule,tokens:shuffle(tokens.map((t,i)=>({t,id:i}))),lang:'ru'}}
function grammarQ(g){return{kind:'choice',key:g.id,prompt:g.prompt,answer:g.answer,choices:shuffle(g.choices),rule:g.rule,label:'Вставь пропущенное слово',lang:'en'}}
function startSession(kind,ids,custom=null){const mods=ids.map(byId),words=unique(mods.flatMap(m=>m.words));let qs=[];if(custom)qs=custom.map(q=>({...q,...(q.tokens?{tokens:shuffle(q.tokens)}:{}),...(q.choices?{choices:shuffle(q.choices)}:{})}));else if(kind==='sentence')qs=shuffle(DRILLS.sentences.filter(s=>ids.includes(s.module))).map(sentenceQ);else if(kind==='exam'){const selected=shuffle(words).slice(0,12);qs=selected.map((w,i)=>wordQuestion(w,words,i>=8?'write':'choice',i>=4));let g=shuffle(DRILLS.grammar.filter(g=>ids.includes(g.module))).slice(0,5).map(grammarQ);let s=shuffle(DRILLS.sentences.filter(s=>ids.includes(s.module))).slice(0,5).map(sentenceQ);qs=[...qs,...g,...s];}else {qs=shuffle(words).slice(0,10).map((w,i)=>wordQuestion(w,words,'choice',i%2===1));}
if(!qs.length){toast('Для этого раздела пока нет заданий.');return}session={kind,ids,qs,index:0,answers:[],locked:false,gained:0,usedHint:false,built:[]};view='session';render();window.scrollTo(0,0)}
function joined(q,ids){return ids.map(id=>q.tokens.find(t=>t.id===id).t).join(' ').replace(/\s+([.!?,])/g,'$1')}
function sessionView(){const s=session,q=s.qs[s.index],exam=s.kind==='exam',answer=s.answers[s.index];return `<div class="narrow"><div class="row between">${button('Выйти','exit','btn link')}<span class="examlabel">${exam?'Контрольная работа':s.kind==='sentence'?'Собираем предложения':'Проверяем знания'}</span><span class="small">${s.index+1} / ${s.qs.length}</span></div><div class="progress"><span style="width:${100*s.index/s.qs.length}%"></span></div><section class="panel"><p class="eyebrow">${q.label}</p><div class="question" lang="${q.lang}">${esc(q.prompt)}</div>${q.kind==='choice'?`<div class="choices">${q.choices.map((c,i)=>button(esc(c),'answer-choice','choice '+(s.locked&&!exam?(c===q.answer?'correct':c===answer.given?'wrong':''):''),`data-index="${i}" ${s.locked?'disabled':''}`)).join('')}</div>`:q.kind==='write'?`<form id="writeform"><label class="small muted" for="written">Перевод на английский</label><input id="written" autocomplete="off" autocapitalize="none" spellcheck="false" ${s.locked?'disabled':''} value="${esc(answer?.given||'')}" placeholder="Введи слово или фразу"><p class="small muted">Регистр и знаки препинания не влияют на оценку.</p>${s.locked?'':button('Ответить','answer-write','btn full','type="submit"')}</form>`:`<p class="small muted">Нажимай на слова по порядку. Нажми на выбранное слово, чтобы вернуть его.</p><div class="answerbox" aria-label="Твоё предложение"><div class="tokens">${s.built.length?s.built.map(id=>button(esc(q.tokens.find(t=>t.id===id).t),'remove-token','token',`data-index="${id}" ${s.locked?'disabled':''}`)).join(''):'<span class="muted small">Здесь появится твоё предложение</span>'}</div></div><div class="tokens" aria-label="Слова для предложения">${q.tokens.map(t=>button(esc(t.t),'add-token','token '+(s.built.includes(t.id)?'used':''),`data-index="${t.id}" ${s.built.includes(t.id)||s.locked?'disabled':''}`)).join('')}</div>${!s.locked?`<div class="row">${button('Проверить предложение','answer-sentence','btn',s.built.length!==q.tokens.length?'disabled':'')}${button('Очистить','clear-tokens','btn secondary')}${!exam?button('Подсказка','hint','btn soft'):''}</div>`:''}${s.usedHint&&!exam?`<div class="hint"><b>Как построить фразу</b><p class="small">${esc(q.rule)}</p><p class="small">Начни с «${esc(q.answer.split(' ')[0])}».</p></div>`:''}`}${s.locked?exam?`<div class="feedback" role="status">Ответ записан. Разбор будет в конце.</div>`:`<div class="feedback ${answer.correct?'':'error'}" role="status"><b>${answer.correct?'Верно!':'Давай разберёмся'}</b><p>${answer.correct?(answer.hinted?'Получилось с подсказкой. Попробуй позже без неё.':answer.gained?`+${answer.gained} звёзд. Хорошая работа!`:'Ты это уже умеешь — отличное повторение!'):`Правильный ответ: <strong lang="en">${esc(q.answer)}</strong>`}</p><p class="small">${esc(q.rule)}</p></div>`:''}${s.locked?button(s.index===s.qs.length-1?'Посмотреть результат':'Дальше →','next-question','btn full','style="margin-top:16px"'):button('Не знаю — пропустить','skip','btn link')}</section>${exam?'<p class="small muted center">Без подсказок и картинок. За каждое задание — 1 балл. Время не ограничено.</p>':'<p class="small muted center">Ошибаться можно. После занятия повторим трудные задания.</p>'}</div>`}
function submit(given){const s=session;if(s.locked)return;const q=s.qs[s.index];const correct=matches(q,given);const a={given,correct,hinted:s.usedHint,gained:0};s.answers.push(a);s.locked=true;if(correct&&!s.usedHint&&s.kind!=='exam'){a.gained=award(q);s.gained+=a.gained}render();}
function finish(){const s=session;if(s.kind==='exam'){s.answers.forEach((a,i)=>{if(a.correct){a.gained=award(s.qs[i]);s.gained+=a.gained}})}const correct=s.answers.filter(a=>a.correct).length;result={...s,correct,total:s.qs.length,percent:Math.round(correct/s.qs.length*100)};progress.results.unshift({date:new Date().toISOString(),kind:s.kind,ids:s.ids,correct,total:s.qs.length,percent:result.percent});progress.results=progress.results.slice(0,100);save();view='result';render();window.scrollTo(0,0)}
function resultView(){const r=result,errors=r.qs.filter((q,i)=>!r.answers[i].correct||r.answers[i].hinted);return `<div class="narrow">${back()}<div class="panel center"><div class="eyebrow">${r.kind==='exam'?'Контрольная завершена':'Занятие завершено'}</div><h1>${r.percent>=80?'Отличная работа!':'Ты сделал ещё один шаг.'}</h1><div class="resulttitle">${r.correct} <span class="muted" style="font-size:25px">из ${r.total}</span></div><p>${r.percent}% верных ответов · +${r.gained} звёзд</p><p class="muted small">${r.percent>=80?'Продолжай: новые слова уже ждут.':'Повтори трудные задания — так знания становятся прочнее.'}</p><div class="row">${errors.length?button('Повторить трудное','retry-errors'):''}${button('К разделам','home','btn secondary')}</div></div><h2>Разбор заданий</h2><div class="panel">${r.qs.map((q,i)=>{const a=r.answers[i];return `<div class="review"><span class="small ${a.correct?'':'wrongtext'}">${i+1}. ${a.correct?'Верно':'Нужно повторить'}${a.hinted?' · с подсказкой':''}</span><h3>${esc(q.prompt)}</h3><p class="small">Твой ответ: ${esc(a.given||'Пропущено')}</p><p class="correcttext">${esc(q.answer)}</p><p class="small muted">${esc(q.rule)}</p></div>`}).join('')}</div></div>`}
function examsView(){const mods=gradeModules().filter(m=>!m.extra);return `<div class="narrow"><div class="eyebrow">Проверь, что уже умеешь</div><h1>Контрольные работы</h1><p class="muted">Перевод, написание слов, грамматика и сборка предложений. Каждый раз — новый набор заданий.</p><div class="tabs">${button('2 класс','grade2',grade===2?'active':'')}${button('3 класс','grade3',grade===3?'active':'')}</div><div class="panel lilac"><h2>${grade} класс · итоговая</h2><p>22 задания по разделам приложенных учебников. Ответы и объяснения — после завершения.</p>${button('Начать итоговую','exam-all','btn purple')}</div><label for="examsection"><b>Работа по одному разделу</b></label><select id="examsection" style="margin:12px 0 18px">${mods.map(m=>`<option value="${m.id}">${esc(title(m))}</option>`).join('')}</select>${button('Начать по разделу','exam-selected','btn full')}<p class="note" style="margin-top:24px">От 15 до 22 заданий в зависимости от раздела. Все задания доступны сразу. Ошибка не отнимает звёзды.</p><h2 class="sectionhead">Последние контрольные</h2>${progress.results.filter(r=>r.kind==='exam').slice(0,8).map(r=>`<div class="panel"><div class="row between"><b>${r.correct} / ${r.total} · ${r.percent}%</b><span class="small muted">${new Date(r.date).toLocaleDateString('ru')}</span></div><span class="small">${esc(r.ids.length===1?title(byId(r.ids[0])):'Итоговая работа')}</span></div>`).join('')||'<p class="muted">Здесь появятся результаты завершённых работ.</p>'}</div>`}
function achievementsView(){let mastered=Object.keys(progress.mastered).length,sentences=Object.keys(progress.rewards).filter(k=>k.startsWith('s')).length,exams=progress.results.filter(r=>r.kind==='exam'&&r.percent>=80).length,days=Object.values(progress.daily).filter(d=>d.bonus).length;const badges=[['🌱','Первый шаг','5 слов проверено',mastered>=5],['📚','Слово за словом','50 слов проверено',mastered>=50],['🧩','Собираю мысли','10 предложений без подсказки',sentences>=10],['🏅','Я справился','Контрольная на 80% и выше',exams>=1],['☀️','Мой ритм','3 дневные цели, в любые дни',days>=3],['🚀','Новый горизонт','200 слов проверено',mastered>=200]];return `<div class="narrow"><div class="eyebrow">Каждый шаг имеет значение</div><h1>Твои достижения</h1><div class="stats"><div class="stat"><b>${progress.xp}</b>звёзд</div><div class="stat"><b>${mastered}</b>слов проверено</div><div class="stat"><b>${sentences}</b>предложений</div></div><div class="panel"><div class="row between"><h3>Уровень ${level()}</h3><span class="small muted">${100-progress.xp%100} звёзд до следующего</span></div><div class="progress"><span style="width:${progress.xp%100}%"></span></div><p class="small muted">5 звёзд за первое самостоятельное решение задания. Ещё 20 — за 10 разных верных ответов за день. За повторение уже решённого задания звёзды не добавляются, но оно учитывается в цели дня.</p></div><div class="badges">${badges.map(([icon,name,detail,ok])=>`<div class="achievement ${ok?'earned':''}"><span aria-hidden="true">${icon}</span><b>${name}</b><small>${ok?'Получено · ':''}${detail}</small></div>`).join('')}</div><p class="note" style="margin-top:25px">Можно пропускать дни: награды не сгорают. Прогресс хранится только в этом браузере на этом устройстве. Очистка данных браузера удалит результаты.</p></div>`}
const models={can:{name:'Что я умею · can',rule:'Кто + can/cannot + действие. В вопросе Can переходит в начало. Глагол всегда без -s и без to.',words:[['swim','плавать'],['jump','прыгать'],['run','бегать'],['sing','петь'],['dance','танцевать'],['read','читать']]},have:{name:'Что у меня есть · have/has got',rule:'I/you/we/they have got. He/she has got. В вопросе Have/Has идёт перед тем, о ком спрашиваем.',words:[['a cat','кошка'],['a dog','собака'],['a ball','мяч'],['a book','книга'],['two pencils','два карандаша'],['blue eyes','голубые глаза']]},like:{name:'Что мне нравится · like',rule:'He/she likes. Остальные like. В отрицании и вопросе do/does + like без -s.',words:[['milk','молоко'],['apples','яблоки'],['chocolate','шоколад'],['rice','рис'],['cheese','сыр'],['ice cream','мороженое']]}};
const people={I:['Я','У меня'],you:['Ты','У тебя'],he:['Он','У него'],she:['Она','У неё'],we:['Мы','У нас'],they:['Они','У них']};
function makeSentence(){const p=builderPerson,t=builderType,form=builderForm,third=p==='he'||p==='she',model=models[t],w=model.words.find(w=>w[0]===builderWord)||model.words[0],P=p==='I'?'I':p[0].toUpperCase()+p.slice(1);let en,ru,verb;if(t==='can'){en=form==='q'?`Can ${p} ${w[0]}?`:`${P} ${form==='no'?'cannot':'can'} ${w[0]}.`;const can={I:'умею',you:'умеешь',he:'умеет',she:'умеет',we:'умеем',they:'умеют'}[p];ru=`${people[p][0]} ${form==='no'?'не ':''}${can} ${w[1]}${form==='q'?'?':'.'}`;verb=form==='no'?'cannot':'can'}else if(t==='have'){verb=third?'has':'have';en=form==='q'?`${third?'Has':'Have'} ${p} got ${w[0]}?`:`${P} ${verb}${form==='no'?' not':''} got ${w[0]}.`;const neg={'a cat':'кошки','a dog':'собаки','a ball':'мяча','a book':'книги','two pencils':'двух карандашей','blue eyes':'голубых глаз'};ru=`${people[p][1]} ${form==='no'?'нет':'есть'} ${form==='no'?neg[w[0]]:w[1]}${form==='q'?'?':'.'}`}else{verb=third?'likes':'like';en=form==='q'?`${third?'Does':'Do'} ${p} like ${w[0]}?`:`${P} ${form==='no'?(third?'does not like':'do not like'):verb} ${w[0]}.`;const ruobj={'milk':'молоко','apples':'яблоки','chocolate':'шоколад','rice':'рис','cheese':'сыр','ice cream':'мороженое'};const loves={I:'люблю',you:'любишь',he:'любит',she:'любит',we:'любим',they:'любят'}[p];ru=`${people[p][0]} ${form==='no'?'не ':''}${loves} ${ruobj[w[0]]}${form==='q'?'?':'.'}`}return{en,ru,rule:model.rule}}
function builderView(){const m=models[builderType],preview=makeSentence();return `<div class="narrow"><div class="eyebrow">Учимся выражать мысли</div><h1>Мастер предложений</h1><p class="muted">Выбирай слова и смотри, как меняется предложение. Затем попробуй собрать его самостоятельно.</p><div class="panel"><label for="model"><small>1. О чём скажем?</small></label><select id="model">${Object.entries(models).map(([k,v])=>`<option value="${k}" ${k===builderType?'selected':''}>${v.name}</option>`).join('')}</select><div class="builderparts" style="margin-top:18px"><label><small>2. Кто?</small><select id="person">${Object.keys(people).map(p=>`<option value="${p}" ${p===builderPerson?'selected':''}>${p} — ${people[p][0].toLowerCase()}</option>`).join('')}</select></label><label><small>3. Что / действие?</small><select id="builderword">${m.words.map(w=>`<option value="${w[0]}" ${w[0]===builderWord?'selected':''}>${w[0]} — ${w[1]}</option>`).join('')}</select></label><label><small>4. Как скажем?</small><select id="builderform"><option value="yes" ${builderForm==='yes'?'selected':''}>Утверждение</option><option value="no" ${builderForm==='no'?'selected':''}>Отрицание</option><option value="q" ${builderForm==='q'?'selected':''}>Вопрос</option></select></label></div><div class="sentencepreview" lang="en">${esc(preview.en)}</div><p>${esc(preview.ru)}</p><div class="row">${button('Послушать','speak-built','btn soft')}${button('Собрать самому','practice-built','btn purple')}</div><div class="hint"><b>Почему именно так?</b><p class="small" style="margin-bottom:0">${preview.rule}</p></div></div><h2>Практика по учебнику</h2><p class="muted">112 заданий: утверждения, отрицания и вопросы. Открой раздел и выбери «Предложения».</p>${button('Выбрать раздел','home','btn full')}</div>`}
function aboutView(){const base=MODULES.filter(m=>!m.extra);return `<div class="narrow">${back()}<h1>Что внутри</h1><div class="panel"><h3>Учебники и охват</h3><p>Spotlight, 2 класс — обе части; 3 класс — первая часть (издание 2023 года).</p><p>Включены словарные списки Word List, лексика основных модулей, вводных уроков, чтения, сказок, культурных разделов, общения в классе и грамматического справочника. Дополнительные слова прежней версии сохранены.</p><p>В словаре ${new Set(MODULES.flatMap(m=>m.words.map(w=>w.en.toLowerCase()))).size} разных слов и выражений; ${MODULES.reduce((a,m)=>a+m.words.length,0)} карточек с повторениями между разделами. Обычные формы множественного числа и окончания глаголов изучаются вместе с исходным словом; имена персонажей не вынесены в отдельные карточки.</p><p>Модули 5–8 за 3 класс отмечены «Дополнительно»: второй части этого учебника среди файлов нет.</p><p class="small muted">Это самостоятельный учебный тренажёр, а не официальное приложение издательства. Контрольные и объяснения составлены для практики; их результаты не являются школьными оценками.</p></div><div class="panel"><h3>Произношение и результаты</h3><p>Используется британская транскрипция. Озвучка зависит от английских голосов, доступных в браузере и на устройстве; иногда требуется интернет.</p><p>Учётная запись не нужна. Результаты сохраняются только в этом браузере. На другом телефоне или другом адресе сайта прогресс будет отдельным. Приложение не отправляет результаты на сервер.</p></div><details class="panel"><summary>Все разделы и источники</summary>${base.map(m=>`<p class="small"><b>${esc(title(m))}</b><br>${esc(m.source)} · ${esc(m.pages)}</p>`).join('')}</details><p class="small muted">Версия 4.0 · Подготовлено 1 октября 2026</p></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,n=Number(b.dataset.index);if(a==='home'||a==='exams'||a==='achievements'||a==='builder'||a==='about'){go(a);return}if(a==='grade2'||a==='grade3'){grade=a==='grade2'?2:3;progress.grade=grade;query='';save();render();return}if(a==='module'){moduleId=b.dataset.id;go('module');return}if(a==='module-back'){go('module');return}if(a==='words'){wordIndex=0;revealed=false;go('words');return}if(a==='reveal'){revealed=true;render();return}if(a==='word-prev'||a==='word-next'){if(a==='word-next'&&wordIndex===byId(moduleId).words.length-1){go('module');toast('Карточки пройдены. Теперь проверь себя!');return}wordIndex+=a==='word-prev'?-1:1;revealed=false;render();return}if(a==='speak-card'||a==='speak-word'){speak(byId(moduleId).words[a==='speak-card'?wordIndex:n].en);return}if(a==='quiz'){startSession('quiz',[moduleId]);return}if(a==='sentences'){startSession('sentence',[moduleId]);return}if(a==='exam-module'){startSession('exam',[moduleId]);return}if(a==='exam-all'){startSession('exam',gradeModules().filter(m=>!m.extra).map(m=>m.id));return}if(a==='exam-selected'){startSession('exam',[$('#examsection').value]);return}if(a==='daily'){const ids=gradeModules().filter(m=>!m.extra).map(m=>m.id);const all=unique(ids.map(byId).flatMap(m=>m.words));const qs=shuffle(all.filter(w=>!today().ids.includes('w:'+w.id))).slice(0,10).map((w,i)=>wordQuestion(w,all,'choice',i%2===1));startSession('quiz',ids,qs);return}if(a==='exit'){go('home');return}if(a==='answer-choice'){submit(session.qs[session.index].choices[n]);return}if(a==='answer-write'){e.preventDefault();const v=$('#written').value.trim();if(v)submit(v);else toast('Введи ответ или нажми «Не знаю».');return}if(a==='add-token'){session.built.push(n);render();return}if(a==='remove-token'){session.built=session.built.filter(x=>x!==n);render();return}if(a==='clear-tokens'){session.built=[];render();return}if(a==='answer-sentence'){submit(joined(session.qs[session.index],session.built));return}if(a==='hint'){session.usedHint=true;render();return}if(a==='skip'){submit('');return}if(a==='next-question'){if(session.index===session.qs.length-1)finish();else{session.index++;session.locked=false;session.usedHint=false;session.built=[];render();window.scrollTo(0,0)}return}if(a==='retry-errors'){const qs=result.qs.filter((q,i)=>!result.answers[i].correct||result.answers[i].hinted);startSession('practice',result.ids,qs);return}if(a==='speak-built'){speak(makeSentence().en);return}if(a==='practice-built'){let x=makeSentence();startSession('sentence',[],[sentenceQ({...x,id:'builder:'+normal(x.en)})]);return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#modulegrid').innerHTML=moduleGrid()}});
document.addEventListener('change',e=>{let id=e.target.id,v=e.target.value;if(id==='model'){builderType=v;builderWord=models[v].words[0][0]}else if(id==='person')builderPerson=v;else if(id==='builderword')builderWord=v;else if(id==='builderform')builderForm=v;else return;render()});
document.addEventListener('submit',e=>{if(e.target.id==='writeform'){e.preventDefault();const v=$('#written').value.trim();if(v)submit(v)}});
render();
</script></body></html>
