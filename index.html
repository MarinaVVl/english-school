let grade=3,screen='start',mi=null,idx=0,reveal=false,questions=[],qi=0,score=0,locked=false,sentence=null,built=[],lastErrors=[];
let progress=JSON.parse(localStorage.getItem('engSchoolV3')||'{}');
const A=document.getElementById('app'); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem('engSchoolV3',JSON.stringify(progress)); const mix=a=>[...a].sort(()=>Math.random()-.5); const gm=()=>modules.map((m,i)=>({...m,i})).filter(m=>m.grade===grade);
function nav(active='home'){return `<div class="nav"><div class="navin"><button class="${active==='home'?'on':''}" onclick="screen='modules';render()">📚<br>Разделы</button><button class="${active==='results'?'on':''}" onclick="screen='results';render()">🏆<br>Результаты</button><button onclick="screen='start';render()">🏠<br>Главная</button></div></div>`}
function top(){return `<div class="top"><div class="logo">📘 Английский в школе</div><div class="badge">⭐ ${Object.values(progress).filter(Number.isFinite).reduce((a,b)=>a+b,0)}</div></div>`}
function speak(t){if(!('speechSynthesis'in window)){alert('На этом устройстве озвучка недоступна');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.78;speechSynthesis.speak(u)}
function render(){
 if(screen==='start'){A.innerHTML=`${top()}<div class="hero"><div class="book">📖✏️</div><h1>АНГЛИЙСКИЙ<br>В ШКОЛЕ</h1><p class="subtitle">Учись • Тренируйся • Проверяй • Развивайся</p></div><button class="big blue" onclick="grade=2;screen='modules';render()">👦　2 класс　›</button><button class="big green" onclick="grade=3;screen='modules';render()">👧　3 класс　›</button>`;return}
 if(screen==='modules'){A.innerHTML=`${top()}<button class="back" onclick="screen='start';render()">‹ Назад</button><h2 class="title">${grade} класс</h2>${gm().map(m=>`<button class="card module" onclick="mi=${m.i};screen='module';render()"><span class="ico">${m.emoji}</span><span><b>${esc(m.title)}</b><div class="small">${m.words.length} слов и выражений</div></span><span class="arrow">›</span></button>`).join('')}${nav('home')}`;return}
 if(screen==='module'){let m=modules[mi];let p=progress['m'+mi]||0;A.innerHTML=`${top()}<button class="back" onclick="screen='modules';render()">‹ ${grade} класс</button><div class="hero" style="padding:0"><div class="ico">${m.emoji}</div><h2>${esc(m.title)}</h2></div><div class="actions"><button class="big blue" onclick="startLearn()">📚　Учить слова</button><button class="big green" onclick="startQuiz(false)">📝　Проверить себя</button><button class="big orange" onclick="startSentence()">✍️　Составляем предложения</button><button class="big purple" onclick="screen='grammar';render()">📖　Грамматика</button><button class="big pink" onclick="startQuiz(true)">🏆　Контрольная работа</button></div><p class="small">Прогресс модуля</p><div class="progress"><div class="bar" style="width:${Math.min(100,p*20)}%"></div></div>${nav('home')}`;return}
 if(screen==='learn'){let m=modules[mi],w=m.words[idx];A.innerHTML=`${top()}<button class="back" onclick="screen='module';render()">‹ К модулю</button><div class="progress"><div class="bar" style="width:${100*(idx+1)/m.words.length}%"></div></div><div class="panel"><div class="small">${idx+1} / ${m.words.length}</div><div class="word">${esc(w[0])}</div><div class="ipa">[${esc(w[1])}]</div><button class="btn light" onclick="speak(${JSON.stringify(w[0])})">🔊 Послушать</button>${reveal?`<div class="trans">${esc(w[2])}</div>`:`<p><button class="btn" onclick="reveal=true;render()">Показать перевод</button></p>`}<button class="btn light" ${idx===0?'disabled':''} onclick="idx--;reveal=false;render()">‹</button><button class="btn" onclick="nextLearn()">${idx===m.words.length-1?'Готово ✓':'Дальше ›'}</button></div>`;return}
 if(screen==='grammar'){let m=modules[mi];A.innerHTML=`${top()}<button class="back" onclick="screen='module';render()">‹ К модулю</button><h2 class="title">Грамматика</h2><div class="panel"><div class="grammar"><b>Правило раздела</b><br><br>${esc(m.grammar)}</div><div class="note">💡 Прочитай правило, затем потренируйся в разделе «Составляем предложения».</div><button class="btn" onclick="startSentence()">Перейти к предложениям ›</button></div>`;return}
 if(screen==='quiz'){renderQuiz();return}
 if(screen==='sentence'){renderSentence();return}
 if(screen==='results'){let rows=gm().map(m=>{let v=progress['best'+m.i]||0;return `<div class="card module"><span class="ico">${m.emoji}</span><span><b>${esc(m.title)}</b><div class="progress" style="margin-top:8px"><div class="bar" style="width:${v}%"></div></div></span><b>${v}%</b></div>`}).join('');A.innerHTML=`${top()}<button class="back" onclick="screen='modules';render()">‹ Назад</button><h2 class="title">Мои результаты</h2>${rows}${nav('results')}`;return}
}
function startLearn(){idx=0;reveal=false;screen='learn';render()} function nextLearn(){let m=modules[mi];if(idx<m.words.length-1){idx++;reveal=false;render()}else{progress['m'+mi]=Math.max(progress['m'+mi]||0,1);save();screen='module';render()}}
function makeQs(ids,n,control){let pool=ids.flatMap(i=>modules[i].words.map(w=>({w,i})));let out=[];mix(pool).slice(0,Math.min(n,pool.length)).forEach((x,k)=>{let wrong=mix(pool.filter(y=>y.w[0]!==x.w[0])).slice(0,3);if(k%3===2)out.push({type:'input',prompt:'Напиши по-английски: '+x.w[2],answer:x.w[0]});else if(k%3===0)out.push({type:'choice',prompt:'Как будет по-русски: '+x.w[0]+'?',answer:x.w[2],opts:mix([x.w[2],...wrong.map(y=>y.w[2])])});else out.push({type:'choice',prompt:'Как по-английски: '+x.w[2]+'?',answer:x.w[0],opts:mix([x.w[0],...wrong.map(y=>y.w[0])])})});if(control){let m=modules[ids[0]];out.push({type:'choice',prompt:'Выбери правило этого модуля',answer:m.grammar,opts:mix([m.grammar,...mix(gm().filter(x=>x.i!==ids[0])).slice(0,3).map(x=>x.grammar)])})}return out}
function startQuiz(control){questions=makeQs([mi],control?9:10,control);qi=0;score=0;locked=false;lastErrors=[];screen='quiz';render()}
function choose(v){if(locked)return;locked=true;let x=questions[qi];if(v===x.answer)score++;else lastErrors.push({q:x.prompt,a:x.answer});render()}
function typed(){if(locked)return;let x=questions[qi],v=document.getElementById('ans').value.trim().toLowerCase().replace(/[.!?]$/,'');locked=true;if(v===x.answer.toLowerCase())score++;else lastErrors.push({q:x.prompt,a:x.answer});render()}
function nextQ(){qi++;locked=false;render()}
function renderQuiz(){if(qi>=questions.length){let pct=Math.round(score/questions.length*100);progress['best'+mi]=Math.max(progress['best'+mi]||0,pct);progress['m'+mi]=Math.max(progress['m'+mi]||0,pct>=80?3:2);save();A.innerHTML=`${top()}<button class="back" onclick="screen='module';render()">‹ К модулю</button><div class="panel"><div style="font-size:65px">🏆</div><h2>Работа завершена!</h2><div class="score">${pct}%</div><div class="resultrow"><div class="statbox">✅ Правильно<br><b>${score}</b></div><div class="statbox">❌ Ошибки<br><b>${questions.length-score}</b></div></div>${lastErrors.length?`<div class="note"><b>Работа над ошибками</b><br>${lastErrors.slice(0,5).map(e=>esc(e.q)+' → <b>'+esc(e.a)+'</b>').join('<br>')}</div>`:''}<button class="btn" onclick="screen='module';render()">Продолжить</button></div>`;return}let x=questions[qi];let body=`<div class="small">Задание ${qi+1} / ${questions.length}</div><div class="progress"><div class="bar" style="width:${100*(qi+1)/questions.length}%"></div></div><h2>${esc(x.prompt)}</h2>`;if(x.type==='input'){body+=`<input id="ans" placeholder="Введи ответ" ${locked?'disabled':''}><button class="btn" onclick="typed()" ${locked?'disabled':''}>Проверить</button>`;if(locked){let err=lastErrors.at(-1);body+=err&&err.q===x.prompt?`<p>❌ Правильный ответ: <b>${esc(x.answer)}</b></p>`:`<p>✅ Правильно!</p>`}}else body+=x.opts.map(o=>`<button class="choice ${locked?(o===x.answer?'ok':''):''}" onclick='choose(${JSON.stringify(o)})' ${locked?'disabled':''}>${esc(o)}</button>`).join('');if(locked)body+=`<button class="btn" onclick="nextQ()">${qi===questions.length-1?'Результат':'Дальше ›'}</button>`;A.innerHTML=`${top()}<button class="back" onclick="screen='module';render()">‹ Выйти</button><div class="panel">${body}</div>`}
function pools(){let ws=modules.filter(m=>m.grade===grade).flatMap(m=>m.words);let find=arr=>ws.filter(w=>arr.some(t=>w[2].includes(t))).map(w=>w[0]);return{action:find(['прыгать','бегать','плавать','петь','танцевать','летать']),noun:find(['мяч','кукла','книга','рюкзак','диван']),room:find(['кухня','спальня','ванная','гостиная']),food:find(['яблоко','банан','сыр','хлеб','пицца','рыба']),weather:find(['солнечно','дождливо','ветрено','снежно']),clothes:find(['шляпа','куртка','футболка','юбка','платье']),family:find(['мама','папа','брат','сестра']),body:find(['хвост','голова','нога','ухо','глаз','нос']),routine:find(['вставать','завтракать','идти в школу','обедать','приходить домой']),action_ing:['playing','reading','writing','drawing','singing','dancing','running','swimming']}}
function startSentence(){screen='sentence';newSentence()} function newSentence(){let p=patterns[grade][Math.floor(Math.random()*patterns[grade].length)],ps=pools(),parts=p.map(t=>{if(t.startsWith('{')){let a=ps[t.slice(1,-1)]||['word'];return a[Math.floor(Math.random()*a.length)]||'word'}return t});sentence={answer:parts.join(' ').replace(' .','.'),tokens:mix(parts)};built=[];if(screen==='sentence')render()}
function addTok(i){built.push(sentence.tokens.splice(i,1)[0]);render()} function resetSent(){sentence.tokens=mix(sentence.tokens.concat(built));built=[];render()} function checkSent(){let s=built.join(' ').replace(' .','.');document.getElementById('feedback').innerHTML=s===sentence.answer?'✅ <b>Отлично! Правильно.</b>':'❌ Попробуй ещё раз.'}
function renderSentence(){A.innerHTML=`${top()}<button class="back" onclick="screen='module';render()">‹ К модулю</button><h2 class="title">Составляем предложения</h2><div class="panel"><p>Нажимай на слова в правильном порядке:</p><div class="answer">${built.map(esc).join(' ')||'Здесь появится предложение'}</div><div class="tokens">${sentence.tokens.map((t,i)=>`<button class="token" onclick="addTok(${i})">${esc(t)}</button>`).join('')}</div><div id="feedback"></div><button class="btn" onclick="checkSent()">Проверить</button><button class="btn light" onclick="resetSent()">Сбросить</button><button class="btn light" onclick="newSentence()">Другое</button></div>`}
render();
</script></body></html>
